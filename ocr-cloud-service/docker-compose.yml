version: '3.8'
services:
  ocr-cloud-service:
    build: .
    container_name: ocr-cloud-service
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
      - SPRING_PROFILES_ACTIVE=prod
      - OCR_ENGINE_DATAPATH=/usr/share/tesseract-ocr/5/tessdata
    volumes:
      - ./tmp:/app/tmp
    restart: unless-stopped
